<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte Familiale</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:8px;
}

#map{
    height:400px;
    width:100%;
}

.container{
    padding:20px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h2>📍 Carte Familiale</h2>

</header>

<div id="map"></div>

<div class="container">

<input
type="text"
id="nomMembre"
placeholder="Votre prénom"
style="
width:100%;
padding:15px;
margin-bottom:10px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
">

<button onclick="demanderPosition()">
📍 Partager ma position
</button>

<div id="gpsResult" class="card">

Position non envoyée

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let monMarqueur = null;
    let marqueursFamille = [];
    let gpsActif = false;
    let appareilId =
    localStorage.getItem(
        "carteFamilialeId"
    );

if(!appareilId){

    appareilId =
        crypto.randomUUID();

    localStorage.setItem(
        "carteFamilialeId",
        appareilId
    );
}
const map = L.map('map').setView(
    [48.8566,2.3522],
    12
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 maxZoom:19
}).addTo(map);

async function demanderPosition(){

    const nom =
        document.getElementById(
            "nomMembre"
        ).value.trim();

    if(nom === ""){

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="error">
        Veuillez saisir votre prénom
        </span>`;

        return;
    }

    const resultat =
    document.getElementById('gpsResult');

resultat.innerHTML =
    "Recherche GPS...";

if(!gpsActif){

    gpsActif = true;

    navigator.geolocation.watchPosition(

        afficherPosition,

        erreurPosition,

        {
            enableHighAccuracy:true,
            maximumAge:0
        }

    );

}
}
async function afficherPosition(position){

    let latitude =
        position.coords.latitude;

    let longitude =
        position.coords.longitude;

    if(monMarqueur){
        map.removeLayer(monMarqueur);
    }

    monMarqueur =
        L.marker([
            latitude,
            longitude
        ]).addTo(map);

    monMarqueur.bindTooltip(
    document.getElementById(
        "nomMembre"
    ).value,
    {
        permanent:true,
        direction:'top'
    }
);
   
    map.setView(
        [latitude,longitude],
        16
    );

    try{

        await fetch(
            "https://cartefamiliale-api.onrender.com/position",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

    id: appareilId,

    nom:document.getElementById(
        "nomMembre"
    ).value,

    latitude:latitude,

    longitude:longitude,

    date:new Date().toISOString()

})
            }
        );

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="success">
        ✅ Position envoyée au serveur
        </span>`;
    }
    catch(e){

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="error">
        ❌ Erreur serveur
        </span>`;
    }
}

function erreurPosition(erreur){

    document.getElementById(
        "gpsResult"
    ).innerHTML =

    `<span class="error">
    ❌ Autorisation refusée ou GPS indisponible
    </span>`;
}

async function chargerPositions(){
    marqueursFamille.forEach(
    m => map.removeLayer(m)
);

marqueursFamille = [];

    try{

        const response =
            await fetch(
                "https://cartefamiliale-api.onrender.com/positions"
            );

        const data =
            await response.json();

        data.forEach(item=>{

            if(
                item.latitude &&
                item.longitude
            ){

                const marqueur = L.marker([
    item.latitude,
    item.longitude
])
.addTo(map)
.bindTooltip(
    item.nom || "Membre",
    {
        permanent:true,
        direction:'top'
    }
);

marqueursFamille.push(
    marqueur
);
            }

        });

    }
    catch(e){

        console.log(e);

    }
}

chargerPositions();
    setInterval(
    chargerPositions,
    5000
);

</script>

</body>
</html>
