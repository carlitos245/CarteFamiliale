<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte Familiale</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:15px;
}

#map{
    height:500px;
    width:100%;
}

.container{
    padding:20px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>📍 Carte Familiale</h1>

<p>Famille : FAM-395341</p>

</header>

<div id="map"></div>

<div class="container">

<input
type="text"
id="nomMembre"
placeholder="Votre prénom"
style="
width:100%;
padding:15px;
margin-bottom:10px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
">

<button onclick="demanderPosition()">
📍 Partager ma position
</button>

<div id="gpsResult" class="card">

Position non envoyée

</div>

</div>

<div id="gpsResult" class="card">

Position non envoyée

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView(
    [48.8566,2.3522],
    12
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 maxZoom:19
}).addTo(map);

let monMarqueur = null;

async function demanderPosition(){

    const nom =
        document.getElementById(
            "nomMembre"
        ).value.trim();

    if(nom === ""){

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="error">
        Veuillez saisir votre prénom
        </span>`;

        return;
    }

    const resultat =
        document.getElementById('gpsResult');

    resultat.innerHTML =
        "Recherche GPS...";

async function afficherPosition(position){

    let latitude =
        position.coords.latitude;

    let longitude =
        position.coords.longitude;

    if(monMarqueur){
        map.removeLayer(monMarqueur);
    }

    monMarqueur =
        L.marker([
            latitude,
            longitude
        ]).addTo(map);

    monMarqueur.bindPopup(
        "📱 Mon iPhone"
    );

    map.setView(
        [latitude,longitude],
        16
    );

    try{

        await fetch(
            "https://cartefamiliale-api.onrender.com/position",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    famille:"FAM-395341",
                    nom:"iPhone",
                    latitude:latitude,
                    longitude:longitude,
                    date:new Date().toISOString()
                })
            }
        );

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="success">
        ✅ Position envoyée au serveur
        </span>`;
    }
    catch(e){

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="error">
        ❌ Erreur serveur
        </span>`;
    }
}

function erreurPosition(erreur){

    document.getElementById(
        "gpsResult"
    ).innerHTML =

    `<span class="error">
    ❌ Autorisation refusée ou GPS indisponible
    </span>`;
}

async function chargerPositions(){

    try{

        const response =
            await fetch(
                "https://cartefamiliale-api.onrender.com/positions"
            );

        const data =
            await response.json();

        data.forEach(item=>{

            if(
                item.latitude &&
                item.longitude
            ){

                L.marker([
                    item.latitude,
                    item.longitude
                ])
                .addTo(map)
                .bindPopup(
                    item.nom || "Membre"
                );
            }

        });

    }
    catch(e){

        console.log(e);

    }
}

chargerPositions();

</script>

</body>
</html>
