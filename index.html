<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte Familiale</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:8px;
}

#map{
    height:400px;
    width:100%;
}

.container{
    padding:20px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>
<div id="loginPage">

    <h2>🔒 Carte Familiale</h2>

    <input
        type="password"
        id="password"
        placeholder="Mot de passe familial"
        style="
        width:100%;
        padding:15px;
        margin-bottom:10px;
        font-size:18px;
        "
    >

    <button id="login-btn">
        Entrer
    </button>

    <p id="error" style="color:red;"></p>

</div>

<div id="appPage" style="display:none;">
<header>

<h2>📍 Carte Familiale</h2>

</header>

<div id="map"></div>

<div class="container">

<input
type="text"
id="nomMembre"
placeholder="Votre prénom"
style="
width:100%;
padding:15px;
margin-bottom:10px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
">

<button onclick="demanderPosition()">
📍 Partager ma position
</button>

<div id="gpsResult" class="card">

Position non envoyée

</div>
</div>
</div>
    
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const PASSWORD_HASH = "91de9f668d70cd3e6771ecc7cdbdb96a93f8b427f9ef51de888363acf25ccab7";
async function hash(text){

    const msgUint8 =
        new TextEncoder().encode(text);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            msgUint8
        );

    const hashArray =
        Array.from(
            new Uint8Array(hashBuffer)
        );

    return hashArray
        .map(
            b => b.toString(16)
            .padStart(2,"0")
        )
        .join("");
}
    
    let monMarqueur = null;
    let marqueursFamille = {};
    let gpsActif = false;
    let appareilId =
    localStorage.getItem(
        "carteFamilialeId"
    );

if(!appareilId){

    appareilId =
        crypto.randomUUID();

    localStorage.setItem(
        "carteFamilialeId",
        appareilId
    );
}
let nomSauvegarde =
    localStorage.getItem(
        "nomMembre"
    );
    
const map = L.map('map').setView(
    [48.8566,2.3522],
    12
);
if(nomSauvegarde){

    document.getElementById(
        "nomMembre"
    ).value = nomSauvegarde;

    setTimeout(() => {

        demanderPosition();

    }, 2000);

}
L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 maxZoom:19
}).addTo(map);

async function demanderPosition(){

    const nom =
        document.getElementById(
            "nomMembre"
        ).value.trim();
    
localStorage.setItem(
    "nomMembre",
    nom
);
    if(nom === ""){

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="error">
        Veuillez saisir votre prénom
        </span>`;

        return;
    }

    const resultat =
    document.getElementById('gpsResult');

resultat.innerHTML =
    "Recherche GPS...";

if(!gpsActif){

    gpsActif = true;

    navigator.geolocation.watchPosition(

        afficherPosition,

        erreurPosition,

        {
            enableHighAccuracy:true,
            maximumAge:0
        }

    );

}
}
async function afficherPosition(position){

    let latitude =
        position.coords.latitude;

    let longitude =
        position.coords.longitude;

    if(monMarqueur){
        map.removeLayer(monMarqueur);
    }

    monMarqueur =
        L.marker([
            latitude,
            longitude
        ]).addTo(map);

    
    if(!window.carteCentree){

    map.setView(
        [latitude,longitude],
        16
    );

    window.carteCentree = true;

}

    try{

        await fetch(
            "https://cartefamiliale-api.onrender.com/position",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

    id: appareilId,

    nom:document.getElementById(
        "nomMembre"
    ).value,

    latitude:latitude,

    longitude:longitude,

    date:new Date().toISOString()

})
            }
        );

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="success">
        ✅ Position envoyée au serveur
        </span>`;
    }
    catch(e){

        document.getElementById(
            "gpsResult"
        ).innerHTML =

        `<span class="error">
        ❌ Erreur serveur
        </span>`;
    }
}

function erreurPosition(erreur){

    document.getElementById(
        "gpsResult"
    ).innerHTML =

    `<span class="error">
    ❌ Autorisation refusée ou GPS indisponible
    </span>`;
}

async function chargerPositions(){
    
    try{

        const response =
            await fetch(
                "https://cartefamiliale-api.onrender.com/positions"
            );

        const data =
            await response.json();

        data.forEach(item=>{

            if(
                item.latitude &&
                item.longitude
            ){

                const datePosition =
    new Date(item.date);

const maintenant =
    new Date();

const secondes =
    Math.floor(
        (maintenant - datePosition) / 1000
    );

let tempsTexte = "";

if(secondes < 60){

    tempsTexte =
        secondes + " s";

}else if(secondes < 3600){

    tempsTexte =
        Math.floor(
            secondes / 60
        ) + " min";

}else if(secondes < 86400){

    tempsTexte =
        Math.floor(
            secondes / 3600
        ) + " h";

}else{

    tempsTexte =
        Math.floor(
            secondes / 86400
        ) + " j";
}

const cle =
    item.id || item.nom;

if(marqueursFamille[cle]){

    marqueursFamille[cle]
        .setLatLng([
            item.latitude,
            item.longitude
        ]);

    marqueursFamille[cle]
        .setTooltipContent(
            item.nom +
            " • depuis " +
            tempsTexte
        );

}else{

    marqueursFamille[cle] =
        L.marker([
            item.latitude,
            item.longitude
        ])
        .addTo(map)
        .bindTooltip(
            item.nom +
            " • depuis " +
            tempsTexte,
            {
                permanent:true,
                direction:'top'
            }
        );
}
            }

        });

    }
    catch(e){

        console.log(e);

    }
}

chargerPositions();
    setInterval(
    chargerPositions,
    5000
);

document
.getElementById("login-btn")
.addEventListener(

    "click",

    async () => {

        const password =
            document.getElementById(
                "password"
            ).value;

        const hashed =
            await hash(password);

        if(
            hashed ===
            PASSWORD_HASH
        ){

            sessionStorage.setItem(
                "auth",
                "ok"
            );

            document.getElementById(
                "loginPage"
            ).style.display = "none";

            document.getElementById(
                "appPage"
            ).style.display = "block";

            setTimeout(() => {
                map.invalidateSize();
            }, 200);

        }else{

            document.getElementById(
                "error"
            ).textContent =
            "Mot de passe incorrect";

        }

    }

);

if(
    sessionStorage.getItem(
        "auth"
    ) === "ok"
){

    document.getElementById(
        "loginPage"
    ).style.display = "none";

    document.getElementById(
        "appPage"
    ).style.display = "block";

    setTimeout(() => {
        map.invalidateSize();
    }, 200);

}
        
</script>
</body>
</html>
